<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSC_TK_TRASH_SECOND_SCREEN</title>
  <style>
:root {
  --bg: #090b0d;
  --panel: #101418;
  --panel-2: #151a20;
  --line: #2b333c;
  --text: #f1f5f9;
  --muted: #9ba7b4;
  --red: #ff3434;
  --orange: #ff9d2e;
  --yellow: #f2d84b;
  --green: #44d36e;
  --blue: #52b7ff;
  --purple: #c58cff;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --ssc-glow: #33d7c5;
  --tk-glow: #f0b55a;
  font-family: "Arial Narrow", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { font-size: 17px; letter-spacing: 0; overflow-x: hidden; }
button, input { font: inherit; }

.app {
  min-height: 100vh;
  zoom: var(--ui-zoom, 1);
  background:
    linear-gradient(90deg, rgba(82,183,255,.08), transparent 28%, rgba(255,52,52,.06) 72%, transparent),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025), rgba(255,255,255,.025) 1px, transparent 1px, transparent 5px),
    #090b0d;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto;
  gap: 8px 10px;
  align-items: center;
  padding: 8px 10px;
  background:
    linear-gradient(180deg, rgba(255,217,127,.09), rgba(0,0,0,0) 34%),
    linear-gradient(90deg, #090705, #11151a 46%, #080706);
  border: 1px solid #40351f;
  border-top: 2px solid #7b5a25;
  border-left: 0;
  border-right: 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,214,126,.18);
  overflow: hidden;
}

.topbar::before,
.topbar::after {
  content: "";
  position: absolute;
  pointer-events: none;
}

.topbar::before {
  inset: 3px 7px;
  border: 1px solid rgba(218, 161, 58, .24);
  box-shadow: inset 0 0 18px rgba(0,0,0,.6);
}

.topbar::after {
  top: 5px;
  right: 118px;
  width: min(520px, 42vw);
  height: 88px;
  opacity: .2;
  background-repeat: no-repeat;
  background-position: right center;
  background-size: contain;
  filter: saturate(1.18) contrast(1.05) drop-shadow(0 0 14px rgba(0,0,0,.85));
}

.topbar > * {
  position: relative;
  z-index: 1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.brand h1 {
  margin: 0;
  color: #f7ead0;
  font-size: 17px;
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 1px 0 #000, 0 0 8px rgba(255,192,79,.12);
}

.brand small {
  display: block;
  margin-top: 3px;
  color: #9f9380;
  font-size: 11px;
  white-space: nowrap;
}

.sigil {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid #8a672a;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,190,68,.2), transparent 45%),
    linear-gradient(135deg, #1d1710, #090807);
  color: #ffb443;
  font-weight: 900;
  box-shadow: inset 0 0 18px rgba(255,157,46,.22), 0 0 0 1px #000;
}

.tabs, .actions, .filters, .zone-filters {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.actions {
  grid-column: 1 / -1;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 1px;
  scrollbar-width: thin;
}

.tabs button,
.actions button,
.filters button,
.zone-filters button {
  min-height: 31px;
  border: 1px solid #4a3a22;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,0) 45%),
    linear-gradient(180deg, #18202a, #0b0f14);
  color: #eadfc9;
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 #000, 0 1px 0 #000;
  white-space: nowrap;
}

.tabs button.active,
.actions button.active,
.filters button.active,
.zone-filters button.active {
  border-color: #d09a38;
  background:
    linear-gradient(180deg, rgba(255,217,112,.2), rgba(0,0,0,0) 50%),
    #352311;
  color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255,219,122,.25), 0 0 10px rgba(255,157,46,.16);
}

.actions button.danger-toggle.active { border-color: var(--red); background: #3a1618; }
.actions button#auditOnly.active { border-color: var(--purple); background: #2d1c3d; }

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 0;
  overflow: hidden;
  border: 1px solid #8a672a;
  border-radius: 2px;
  background: #080604;
  box-shadow: inset 0 0 0 1px #000;
}

.lang-switch button {
  min-width: 44px;
  min-height: 31px;
  border: 0;
  border-radius: 0;
  border-right: 1px solid #4a3a22;
  background: linear-gradient(180deg, #1a2028, #0b0f13);
  color: #d7c9ad;
  font-weight: 900;
}

.lang-switch button:last-child {
  border-right: 0;
}

.lang-switch button.active {
  border-color: #d09a38;
  background: #244767;
  color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 0 9px rgba(82,183,255,.2);
}

.lang-switch button:hover,
.lang-switch button:focus {
  background: #1b496d;
  color: #fff;
}

.zone-filters {
  min-width: 0;
  overflow-x: auto;
  flex-wrap: nowrap;
  scrollbar-width: thin;
}

.zone-filters button {
  min-height: 25px;
  padding: 3px 8px;
  border-color: #40351f;
  background: linear-gradient(180deg, #121820, #080b0f);
  color: #c9bea8;
  font-size: 11px;
  text-transform: uppercase;
}

.zone-filters button.active {
  border-color: var(--orange);
  background: #332313;
  box-shadow: inset 0 0 0 1px rgba(255,157,46,.35);
}

.zone-filters .zone-count {
  color: var(--muted);
  margin-left: 3px;
}

.search { position: relative; min-width: 210px; }
.search input {
  width: 100%;
  height: 31px;
  padding: 6px 10px;
  border: 1px solid #4a3a22;
  border-radius: 2px;
  background: #050403;
  color: #f2eadc;
  outline: none;
  box-shadow: inset 0 0 8px rgba(0,0,0,.75);
}

.zoom-control {
  display: inline-flex;
  align-items: center;
  height: 31px;
  border: 1px solid #4a3a22;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,0) 45%),
    #090705;
  color: #d7c9ad;
  border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 #000;
  overflow: hidden;
  white-space: nowrap;
}

.zoom-control span {
  padding: 0 7px;
  color: #a99b83;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.zoom-control select {
  height: 100%;
  border: 0;
  border-left: 1px solid #4a3a22;
  background: #111820;
  color: #f2eadc;
  padding: 0 6px;
  outline: none;
  font: inherit;
  cursor: pointer;
}

.subbar {
  position: sticky;
  top: 99px;
  z-index: 18;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  padding: 7px 10px;
  background:
    linear-gradient(180deg, rgba(255,217,127,.05), rgba(0,0,0,0)),
    rgba(9, 12, 15, .97);
  border-bottom: 1px solid #40351f;
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
}

.raid-plates {
  display: grid;
  grid-template-columns: repeat(2, minmax(180px, 1fr));
  gap: 8px;
  min-width: 0;
}

.raid-plate {
  position: relative;
  min-height: 42px;
  display: flex;
  align-items: end;
  padding: 8px 11px;
  overflow: hidden;
  border: 1px solid #4b3d23;
  background: #090c0e;
  box-shadow: inset 0 0 0 1px #000, inset 0 0 20px rgba(0,0,0,.7);
}

.raid-plate::before {
  content: "";
  position: absolute;
  inset: -10px;
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  opacity: .42;
  filter: saturate(1.12) contrast(1.04);
}

.raid-plate::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.12) 45%, rgba(0,0,0,.66)),
    linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.3));
}

.raid-plate span {
  position: relative;
  z-index: 1;
  color: #fff1c8;
  font-size: 19px;
  line-height: 1;
  font-weight: 950;
  text-shadow: 0 2px 2px #000, 0 0 12px rgba(255,184,77,.35);
}

body.raid-ssc .raid-plate-tk,
body.raid-tk .raid-plate-ssc {
  opacity: .38;
  filter: grayscale(.7);
}

body.raid-ssc .raid-plate-ssc {
  border-color: var(--ssc-glow);
  box-shadow: inset 0 0 0 1px rgba(51,215,197,.28), 0 0 14px rgba(51,215,197,.12);
}

body.raid-tk .raid-plate-tk {
  border-color: var(--tk-glow);
  box-shadow: inset 0 0 0 1px rgba(240,181,90,.3), 0 0 14px rgba(240,181,90,.14);
}

body.raid-all .raid-plate {
  border-color: #9f7f40;
}

.zone-filters {
  grid-column: 1 / -1;
}

.filters {
  overflow-x: auto;
  flex-wrap: nowrap;
  scrollbar-width: thin;
}

.filters button {
  min-height: 31px;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.statusline {
  color: #8e9baa;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

.statusline span {
  opacity: .72;
}

.board {
  padding: 10px 12px 18px;
}

.raid-section + .raid-section { margin-top: 12px; }
.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 8px;
  font-size: 15px;
  color: #dbe7f3;
  text-transform: uppercase;
  text-shadow: 0 1px 0 #000;
}

.section-title span {
  color: var(--muted);
  font-size: 12px;
  text-transform: none;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px;
  align-items: start;
}

.card {
  border: 1px solid var(--line);
  border-left-width: 6px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01)),
    radial-gradient(circle at top right, rgba(255,198,91,.055), transparent 42%),
    var(--panel);
  box-shadow: 0 5px 18px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.025);
  display: grid;
  grid-template-rows: auto auto auto;
}

.card.red { border-left-color: var(--red); }
.card.orange { border-left-color: var(--orange); }
.card.yellow { border-left-color: var(--yellow); }
.card.green { border-left-color: var(--green); }

.card-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 8px 10px 6px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.mobline {
  min-width: 0;
}

.zone {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
}

.mob {
  margin-top: 2px;
  font-size: 21px;
  line-height: 1.05;
  font-weight: 900;
  color: #fff6df;
  text-shadow: 0 2px 0 #000, 0 0 9px rgba(255,218,139,.1);
}

.markers {
  display: flex;
  gap: 3px;
  align-items: start;
}

.marker-star { background-position: 0 0; }
.marker-circle { background-position: 33.333% 0; }
.marker-diamond { background-position: 66.666% 0; }
.marker-triangle { background-position: 100% 0; }
.marker-moon { background-position: 0 100%; }
.marker-square { background-position: 33.333% 100%; }
.marker-cross { background-position: 66.666% 100%; }
.marker-skull { background-position: 100% 100%; }

.card-body {
  padding: 10px 11px 9px;
  display: grid;
  gap: 10px;
}

.quick-call {
  color: #fff;
  font-size: 19px;
  line-height: 1.24;
  font-weight: 950;
  text-shadow: 0 0 8px rgba(255,255,255,.12);
}

.quick-grid {
  display: grid;
  gap: 5px;
}

.quick-line {
  display: grid;
  grid-template-columns: 20px 1fr;
  gap: 8px;
  align-items: start;
  color: #d9e3ec;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 800;
}

.quick-line span {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  height: 19px;
  border: 1px solid #384655;
  color: #ffd36b;
  background: #0b1015;
  font-size: 11px;
  font-weight: 950;
}

.tank-line span { color: #9fd1ff; }

.spell-row {
  margin-top: 1px;
}

.spell-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding-top: 1px;
}

.spells {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.spell,
.inline-spell {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  padding: 1px 5px 1px 1px;
  border: 1px solid #35424e;
  background: #0c1116;
  color: #dbe7f3;
  font-size: 13px;
  cursor: help;
  outline: none;
}

.inline-spell {
  vertical-align: -5px;
  margin: 0 2px;
  padding-right: 4px;
  font-size: .82em;
  line-height: 1;
}

.spell:hover,
.spell:focus,
.inline-spell:hover,
.inline-spell:focus {
  border-color: #d7a43b;
  background: #17120a;
  color: #fff;
}

.spell img,
.inline-spell img {
  width: 21px;
  height: 21px;
  object-fit: cover;
}

.inline-spell img {
  width: 18px;
  height: 18px;
}

.spell-groups {
  display: grid;
  gap: 6px;
}

.spell-group {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 5px 7px;
  align-items: start;
  padding: 6px 7px;
  border: 1px solid #2f3a45;
  background: #090e13;
}

.spell-group-head {
  grid-row: span 2;
  color: #ffd36b;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.05;
}

.spell-group-body {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.spell-group-note {
  color: #d9e3ec;
  font-size: 12px;
  line-height: 1.28;
  font-weight: 800;
}

.spell-tooltip {
  position: fixed;
  z-index: 50;
  width: min(330px, calc(100vw - 20px));
  pointer-events: none;
  opacity: 0;
  transform: translateY(3px);
  border: 1px solid #b78a2b;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0)),
    #08090b;
  color: #f4ead2;
  box-shadow: 0 12px 30px rgba(0,0,0,.65), inset 0 0 0 1px rgba(0,0,0,.9);
  padding: 8px 9px;
  transition: opacity .06s linear, transform .06s linear;
}

.spell-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}

.tip-title {
  color: #ffd36b;
  font-size: 15px;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 5px;
}

.tip-body {
  color: #e8ded0;
  font-size: 13px;
  line-height: 1.25;
  font-weight: 700;
}

.tagbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 11px 10px;
}

.audit-panel {
  margin: 0 9px 8px;
  padding: 7px 8px;
  border: 1px solid #35414d;
  background: #0b1015;
  color: #cfd8e3;
  font-size: 12px;
  line-height: 1.25;
}

.audit-line {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 6px;
  margin-top: 3px;
}

.audit-line:first-child { margin-top: 0; }
.audit-k { color: #8fa0b1; text-transform: uppercase; }
.audit-v { font-weight: 700; }
.confidence-source { color: #44d36e; }
.confidence-inferred { color: #f2d84b; }
.confidence-to_confirm { color: #ff9d2e; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid #3c4855;
  background: #182029;
  padding: 3px 7px;
  font-size: 12px;
  color: #dce7f2;
  line-height: 1;
}

.tag-icons {
  display: inline-flex;
  align-items: center;
  gap: 1px;
}

.tag-glyph {
  min-width: 18px;
  height: 18px;
  display: inline-grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(0,0,0,.35);
  color: #ffd36b;
  font-size: 10px;
  font-weight: 950;
  line-height: 1;
}

.mini-copy {
  min-height: 24px;
  border: 1px solid #536272;
  background: #111820;
  color: #eef5ff;
  padding: 1px 6px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 12px;
}

.tag.focus { color: #fff; border-color: #744; background: #381719; }
.tag.kick { color: #fff; border-color: #855; background: #40211a; }
.tag.sheep { color: #fff; border-color: #7284c8; background: #202943; }
.tag.los { color: #fff; border-color: #6393aa; background: #17303c; }
.tag.tank { color: #fff; border-color: #e2b33b; background: #3d3012; }
.tag.enemy-mc { color: #fff; border-color: #a772d0; background: #311d40; }
.tag.priest-mc { color: #fff; border-color: #73a7ff; background: #172943; }
.tag.stopcc { color: #fff; border-color: #7284c8; background: #202943; }

.empty {
  padding: 24px;
  border: 1px dashed #45515f;
  color: var(--muted);
  text-align: center;
}

body.compact .cards { grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); }
body.compact .card-body { gap: 4px; padding: 6px 8px; }
body.compact .mob { font-size: 19px; }
body.compact .quick-grid, body.compact .spell-row { display: none; }
body.compact .quick-call { font-size: 15px; }
body.compact .tagbar { padding-bottom: 6px; }
body.ultra .quick-grid, body.ultra .tagbar, body.ultra .spell-row { display: none; }
body.ultra .mob { font-size: 18px; }
body.ultra .quick-call { font-size: 14px; }
body.ultra .cards { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
body.fullscreen .topbar, body.fullscreen .subbar { opacity: .18; transition: opacity .12s; }
body.fullscreen .topbar:hover, body.fullscreen .subbar:hover { opacity: 1; }

@media (max-width: 980px) {
  .topbar { grid-template-columns: 1fr; }
  .subbar { top: 151px; grid-template-columns: 1fr; }
  .statusline { white-space: normal; }
}

@media (max-width: 620px) {
  .cards { grid-template-columns: 1fr; }
}

function t() {
  return i18n[state.lang] || i18n.en;
}

function ui(key) {
  return t().ui[key] || i18n.en.ui[key] || key;
}

function localizedItem(item) {
  if (state.lang !== "fr") return item;
  const frText = frTrashText[item.mob];
  const localized = frText ? { ...item, ...frText } : { ...item };
  localized.originalMob = item.mob;
  localized.mob = frMobNames[item.mob] || item.mob;
  localized.danger = localizeFrenchNames(localized.danger);
  localized.call = localizeFrenchNames(localized.call);
  localized.tank = localizeFrenchNames(localized.tank);
  return localized;
}

function spellDisplayName(name) {
  return state.lang === "fr" ? (frSpellNames[name] || name) : name;
}

function spellIcon(name, fallback) {
  return guideSpellIcons[name] || fallback || icon(name.toLowerCase().replace(/[^a-z0-9]+/g, "_"));
}

function spellInfo(name, fallback) {
  const descriptions = t().spellDescriptions;
  return {
    name,
    displayName: spellDisplayName(name),
    description: descriptions[name] || ui("unknownSpell"),
    src: spellIcon(name, fallback)
  };
}

function save() {
  localStorage.setItem("raid", state.raid);
  localStorage.setItem("zone", state.zone);
  localStorage.setItem("mode", state.mode);
  localStorage.setItem("zoom", state.zoom);
  localStorage.setItem("dangerOnly", state.dangerOnly);
  localStorage.setItem("auditOnly", state.auditOnly);
  localStorage.setItem("tags", JSON.stringify([...state.tags]));
}

function normalized(text) {
  return String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function visibleItems() {
  const q = normalized(state.query);
  return trashData.map(localizedItem).filter((item) => {
    if (state.raid !== "ALL" && item.raid !== state.raid) return false;
    if (state.zone !== "ALL" && item.zone !== state.zone) return false;
    if (state.dangerOnly && !["red", "orange"].includes(item.priority)) return false;
    if (state.auditOnly && item.confidence !== "to_confirm") return false;
    for (const tag of state.tags) if (!item.tags.includes(tag)) return false;
    if (!q) return true;
    const originalMob = item.originalMob || item.mob;
    const enItem = trashData.find((base) => base.mob === originalMob) || item;
    const frItem = frTrashText[originalMob] || {};
    const hay = normalized([
      item.raid, item.zone, item.mob, originalMob, item.priority, item.danger, item.call, item.tank,
      enItem.danger, enItem.call, enItem.tank, frItem.danger, frItem.call, frItem.tank,
      item.tags.join(" "), item.spells.map(([name]) => name).join(" "),
      (item.spellGroups || []).map((group) => [group.label, group.note, ...group.spells].join(" ")).join(" "),
      item.spells.map(([name]) => frSpellNames[name] || "").join(" "),
      item.confidence, item.sourceNote, item.sourceQuoteShort, item.focusReason,
      item.recommendedMarker, item.callShort, String(item.focusRank ?? "")
    ].join(" "));
    return hay.includes(q);
  });
}

}

    const spell = spellInfo(name, src);
    return spellChip(spell, "spell", true);
  }).join("");
}

function spellPillsFromNames(names) {
  return names.map((name) => spellChip(spellInfo(name), "spell", true)).join("");
}

function spellChip(spell, className = "spell", showText = true) {
  return `<span class="${className}" tabindex="0" title="${escapeHtml(spell.description)}" data-tip-title="${escapeHtml(spell.displayName)}" data-tip="${escapeHtml(spell.description)}"><img src="${escapeHtml(spell.src)}" alt="">${showText ? escapeHtml(spell.displayName) : ""}</span>`;
}

function renderSpellBlock(item) {
  if (!item.spellGroups?.length) return `<div class="spell-strip">${spellPills(item.spells)}</div>`;
  const groups = item.spellGroups;
  return `<div class="spell-groups">${groups.map((group) => `
    <div class="spell-group">
      <div class="spell-group-head">${escapeHtml(group.label)}</div>
      <div class="spell-group-body">${spellPillsFromNames(group.spells)}</div>
      <div class="spell-group-note">${escapeHtml(group.note || "")}</div>
    </div>
  `).join("")}</div>`;
}

function richText(text) {
  const source = String(text);
  const candidates = Object.keys(guideSpellIcons)
    .flatMap((name) => {
      const displayName = spellDisplayName(name);
      return [name, displayName].filter((value, index, arr) => value && arr.indexOf(value) === index).map((label) => ({ label, name }));
    })
    .sort((a, b) => b.label.length - a.label.length);
  let html = "";
  for (let i = 0; i < source.length;) {
    const match = candidates.find(({ label }) => source.startsWith(label, i));
    if (match) {
      html += spellChip(spellInfo(match.name), "inline-spell", true);
      i += match.label.length;
    } else {
      html += escapeHtml(source[i]);
      i += 1;
    }
  }
  return html;
}

function tagPills(tags) {
  const labels = t().tagLabels;
  return tags.slice(0, 3).map((tag) => `<span class="tag ${tag}">${tagButtonContent(tag, labels[tag] || tag)}</span>`).join("");
}

function auditPanel(item) {
  if (!state.auditOnly) return "";
  const rank = item.focusRank ?? "—";
  const marker = item.recommendedMarker ? markerImgs([item.recommendedMarker]) : "—";
  const sourceText = item.sourceQuoteShort || item.sourceNote || "—";
  return `
    <div class="audit-panel">
      <div class="audit-line"><span class="audit-k">${ui("auditConfidence")}</span><span class="audit-v confidence-${escapeHtml(item.confidence)}">${escapeHtml(item.confidence)}</span></div>
      <div class="audit-line"><span class="audit-k">${ui("auditRank")}</span><span class="audit-v">${escapeHtml(rank)}</span></div>
      <div class="audit-line"><span class="audit-k">${ui("auditMarker")}</span><span class="audit-v">${marker}</span></div>
      <div class="audit-line"><span class="audit-k">${ui("auditReason")}</span><span class="audit-v">${escapeHtml(item.focusReason || "—")}</span></div>
      <div class="audit-line"><span class="audit-k">${ui("auditSource")}</span><span class="audit-v"><a href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noreferrer">${escapeHtml(sourceText)}</a></span></div>
    </div>
  `;
}

function syncStaticText() {
  document.documentElement.lang = state.lang;
  document.querySelector("[data-i18n='subtitle']").textContent = ui("subtitle");
  searchEl.placeholder = ui("searchPlaceholder");
  document.querySelector("[data-mode='detailed']").textContent = ui("detailed");
  document.querySelector("#dangerOnly").textContent = ui("dangerOnly");
  document.querySelector("#auditOnly").textContent = ui("auditOnly");
  document.querySelector("#reset").textContent = ui("reset");
  document.documentElement.style.setProperty("--ui-zoom", state.zoom);
  zoomSelectEl.value = state.zoom;
  document.querySelectorAll("[data-lang-choice]").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.langChoice === state.lang);
  });
  document.querySelector("[data-i18n='keys']").textContent = ui("keys");
}

function renderFilters() {
  const labels = t().tagLabels;
  filtersEl.innerHTML = Object.entries(labels)
    .filter(([key]) => ["focus", "kick", "sheep", "stopcc", "los", "fear", "enemy-mc", "priest-mc", "banish", "cleave", "aoe", "tank", "ranged"].includes(key))
    .map(([key, label]) => `<button data-tag="${key}" class="${state.tags.has(key) ? "active" : ""}">${tagButtonContent(key, label)}</button>`)
    .join("");
}

function zonesForCurrentRaid() {
  const zoneMap = new Map();
  trashData
    .filter((item) => state.raid === "ALL" || item.raid === state.raid)
    .forEach((item) => zoneMap.set(item.zone, (zoneMap.get(item.zone) || 0) + 1));
  return [...zoneMap.entries()];
}

function renderZoneFilters() {
  const zones = zonesForCurrentRaid();
  if (state.zone !== "ALL" && !zones.some(([zone]) => zone === state.zone)) {
    state.zone = "ALL";
  }

  zoneFiltersEl.innerHTML = [
    `<button data-zone="ALL" class="${state.zone === "ALL" ? "active" : ""}">${ui("allZones")} <span class="zone-count">${trashData.filter((item) => state.raid === "ALL" || item.raid === state.raid).length}</span></button>`,
    ...zones.map(([zone, count]) => `<button data-zone="${escapeHtml(zone)}" class="${state.zone === zone ? "active" : ""}">${zone} <span class="zone-count">${count}</span></button>`)
  ].join("");
}

function renderCards() {
  syncStaticText();
  document.body.classList.toggle("raid-ssc", state.raid === "SSC");
  document.body.classList.toggle("raid-tk", state.raid === "TK");
  document.body.classList.toggle("raid-all", state.raid === "ALL");
  document.body.classList.toggle("compact", state.mode === "compact" || state.mode === "ultra");
  document.body.classList.toggle("ultra", state.mode === "ultra");
  document.querySelectorAll("[data-mode]").forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === state.mode));
  document.querySelector(".danger-toggle").classList.toggle("active", state.dangerOnly);
  document.querySelector("#auditOnly").classList.toggle("active", state.auditOnly);
  document.querySelectorAll("[data-raid]").forEach((btn) => btn.classList.toggle("active", btn.dataset.raid === state.raid));

  const items = visibleItems();
  countEl.textContent = `${items.length}/${trashData.length} mobs`;

  if (!items.length) {
    cardsEl.innerHTML = `<div class="empty">${ui("empty")}</div>`;
    return;
  }

  const byRaid = items.reduce((acc, item) => {
    (acc[item.raid] ||= []).push(item);
    return acc;
  }, {});

  cardsEl.innerHTML = Object.entries(byRaid).map(([raid, raidItems]) => `
    <section class="raid-section">
      <div class="section-title">${raid} <span>${raidItems.length} ${ui("visibleCards")}</span></div>
      <div class="cards">
        ${raidItems.map((item) => `
          <article class="card ${item.priority}">
            <div class="card-head">
              <div class="mobline">
                <div class="zone">${item.raid} — ${item.zone}</div>
                <div class="mob">${item.mob}</div>
              </div>
              <div class="markers">${markerImgs(item.markers)}</div>
            </div>
            <div class="card-body">
              <div class="quick-call">${escapeHtml(item.call)}</div>
              <div class="quick-grid">
                <div class="quick-line danger-line"><span>!</span><b>${escapeHtml(item.danger)}</b></div>
                <div class="quick-line tank-line"><span>T</span><b>${escapeHtml(item.tank)}</b></div>
              </div>
              <div class="spell-row">${renderSpellBlock(item)}</div>
            </div>
            ${auditPanel(item)}
            <div class="tagbar">${tagPills(item.tags)} <button class="mini-copy" data-single="${escapeHtml(item.call)}">${ui("copy")}</button></div>
          </article>
        `).join("")}
      </div>
    </section>
  `).join("");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

function copyText(text) {
  navigator.clipboard?.writeText(text).catch(() => {
    const input = document.createElement("textarea");
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
  });
}

filtersEl.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-tag]");
  if (!btn) return;
  const tag = btn.dataset.tag;
  state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag);
  save();
  renderFilters();
  renderCards();
});

zoneFiltersEl.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-zone]");
  if (!btn) return;
  state.zone = btn.dataset.zone;
  save();
  renderZoneFilters();
  renderCards();
});

document.addEventListener("click", (event) => {
  const raid = event.target.closest("[data-raid]");
  const mode = event.target.closest("[data-mode]");
  const single = event.target.closest("[data-single]");
  const langChoice = event.target.closest("[data-lang-choice]");
  if (raid) state.raid = raid.dataset.raid;
  if (mode) state.mode = mode.dataset.mode;
  if (langChoice) state.lang = langChoice.dataset.langChoice;
  if (event.target.closest("#dangerOnly")) state.dangerOnly = !state.dangerOnly;
  if (event.target.closest("#auditOnly")) state.auditOnly = !state.auditOnly;
  if (event.target.closest("#reset")) {
    state.raid = "ALL";
    state.zone = "ALL";
    state.mode = "detailed";
    state.dangerOnly = false;
    state.auditOnly = false;
    state.tags.clear();
    state.query = "";
    searchEl.value = "";
    document.body.classList.remove("fullscreen");
  }
  if (event.target.closest("#fullscreen")) document.body.classList.toggle("fullscreen");
  if (single) copyText(single.dataset.single);
  save();
  renderFilters();
  renderZoneFilters();
  renderCards();
});

searchEl.addEventListener("input", (event) => {
  state.query = event.target.value;
  renderCards();
});

zoomSelectEl.addEventListener("change", (event) => {
  state.zoom = event.target.value;
  save();
  renderCards();
});

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input")) return;
  const key = event.key.toLowerCase();
  if (key === "/") {
    event.preventDefault();
    searchEl.focus();
  }
  if (key === "1") state.raid = "SSC";
  if (key === "2") state.raid = "TK";
  if (key === "3") state.raid = "ALL";
  if (key === "c") state.mode = state.mode === "compact" ? "detailed" : "compact";
  if (key === "u") state.mode = state.mode === "ultra" ? "detailed" : "ultra";
  if (key === "a") state.auditOnly = !state.auditOnly;
  if (key === "l") state.lang = state.lang === "fr" ? "en" : "fr";
  if (key === "r") {
    state.zone = "ALL";
    state.dangerOnly = false;
    state.auditOnly = false;
    state.tags.clear();
    state.query = "";
    searchEl.value = "";
  }
  if (key === "f") document.body.classList.toggle("fullscreen");
  save();
  renderFilters();
  renderZoneFilters();
  renderCards();
});

const tooltip = document.createElement("div");
tooltip.className = "spell-tooltip";
document.body.appendChild(tooltip);

function moveTooltip(event) {
  const pad = 14;
  const rect = tooltip.getBoundingClientRect();
  let left = event.clientX + pad;
  let top = event.clientY + pad;
  if (left + rect.width > window.innerWidth - 8) left = event.clientX - rect.width - pad;
  if (top + rect.height > window.innerHeight - 8) top = event.clientY - rect.height - pad;
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${Math.max(8, top)}px`;
}

document.addEventListener("mouseover", (event) => {
  const spell = event.target.closest(".spell[data-tip], .inline-spell[data-tip]");
  if (!spell) return;
  tooltip.innerHTML = `<div class="tip-title">${spell.dataset.tipTitle}</div><div class="tip-body">${spell.dataset.tip}</div>`;
  tooltip.classList.add("visible");
  moveTooltip(event);
});

document.addEventListener("mousemove", (event) => {
  if (tooltip.classList.contains("visible")) moveTooltip(event);
});

document.addEventListener("mouseout", (event) => {
  if (event.target.closest(".spell[data-tip], .inline-spell[data-tip]")) tooltip.classList.remove("visible");
});

document.addEventListener("focusin", (event) => {
  const spell = event.target.closest(".spell[data-tip], .inline-spell[data-tip]");
  if (!spell) return;
  const rect = spell.getBoundingClientRect();
  tooltip.innerHTML = `<div class="tip-title">${spell.dataset.tipTitle}</div><div class="tip-body">${spell.dataset.tip}</div>`;
  tooltip.classList.add("visible");
  moveTooltip({ clientX: rect.left + rect.width / 2, clientY: rect.bottom });
});

document.addEventListener("focusout", (event) => {
  if (event.target.closest(".spell[data-tip], .inline-spell[data-tip]")) tooltip.classList.remove("visible");
});

renderFilters();
renderZoneFilters();
renderCards();

  </script>
</body>
</html>
